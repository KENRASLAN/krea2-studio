<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krea 2 AI Image Generator</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <div class="login-logo">🎨</div>
            <h1>Krea 2 Studio</h1>
            <p>AI-Powered Image Generation</p>
            <button id="googleLoginBtn" class="login-btn">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="app" style="display: none;">
        <aside class="sidebar">
            <div class="logo"><span class="logo-icon"></span><span>Krea Studio</span></div>
            <nav>
                <a href="#" class="nav-item active"><span>📊</span> Generate</a>
                <a href="#" class="nav-item" id="historyNav"><span>🖼️</span> History</a>
            </nav>
            <div class="user-section">
                <div class="user-info">
                    <div class="avatar" id="userAvatar">👤</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">User</div>
                        <div class="user-email" id="userEmail">user@email.com</div>
                    </div>
                </div>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>AI Generate Image</h1>
                <div class="header-actions">
                    <button class="icon-btn" id="refreshApiBtn" title="Refresh API Connection">🔄</button>
                    <div class="status-indicator" id="apiStatus">
                        <span class="status-dot"></span>
                        <span class="status-text">Connecting...</span>
                    </div>
                </div>
            </header>

            <div class="content-grid">
                <!-- Left Panel: Controls -->
                <div class="control-panel">
                    <div class="form-group">
                        <label>Describe your image</label>
                        <textarea id="prompt" placeholder="A serene mountain lake at sunset, highly detailed, cinematic lighting..." rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label>What you DON'T want</label>
                        <input type="text" id="negativePrompt" placeholder="blurry, low quality, watermark">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Width</label>
                            <input type="number" id="width" value="768" min="512" max="1024" step="64">
                        </div>
                        <div class="form-group">
                            <label>Height</label>
                            <input type="number" id="height" value="768" min="512" max="1024" step="64">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Steps</label>
                            <input type="number" id="steps" value="8" min="4" max="20">
                        </div>
                        <div class="form-group">
                            <label>CFG Scale</label>
                            <input type="number" id="guidance" value="0" min="0" max="10" step="0.5">
                        </div>
                    </div>

                    <!-- NEW: LoRA Section -->
                    <div class="form-group" style="border-top: 1px solid var(--border); padding-top: 20px; margin-top: 10px;">
                        <label>🎨 LoRA / Style Adapter (Optional)</label>
                        <input type="text" id="loraId" placeholder="Civitai ID (e.g. 12345) or HF Repo (user/name)">
                        <div class="form-row" style="margin-top: 10px; margin-bottom: 0;">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label>LoRA Strength</label>
                                <input type="number" id="loraScale" value="1.0" min="0" max="2.0" step="0.1">
                            </div>
                        </div>
                    </div>

                    <button class="generate-btn" id="generateBtn">🔮 Generate Image</button>
                    
                    <div class="api-config">
                        <label>Backend API URL</label>
                        <input type="text" id="apiUrlInput" placeholder="https://...ngrok-free.dev">
                        <button id="saveApiBtn" class="save-btn">Save</button>
                    </div>
                </div>

                <!-- Right Panel: Output -->
                <div class="output-panel">
                    <div class="output-header">
                        <div class="output-info">
                            <h2 id="outputTitle">Ready to Generate</h2>
                            <p id="outputCaption">Enter a prompt and click generate</p>
                        </div>
                        <div class="output-actions">
                            <button class="action-btn" id="downloadBtn" disabled>⬇️ Download</button>
                            <button class="action-btn secondary" id="copyBtn" disabled>📋 Copy</button>
                        </div>
                    </div>
                    <div class="image-container" id="imageContainer">
                        <div class="placeholder">
                            <div class="placeholder-icon">🎨</div>
                            <p>Your generated image will appear here</p>
                        </div>
                    </div>
                    <div class="generation-info" id="generationInfo" style="display: none;">
                        <div class="info-item"><span class="info-label">Seed:</span><span class="info-value" id="infoSeed">-</span></div>
                        <div class="info-item"><span class="info-label">Steps:</span><span class="info-value" id="infoSteps">-</span></div>
                        <div class="info-item"><span class="info-label">Size:</span><span class="info-value" id="infoSize">-</span></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Generation History</h2>
                <button class="close-btn" id="closeHistoryBtn">&times;</button>
            </div>
            <div class="history-grid" id="historyGrid"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
